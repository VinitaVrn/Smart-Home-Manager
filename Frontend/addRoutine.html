<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Routines Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Same CSS styles from the main page */
        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(to bottom, #1c1e1f, #1c1e1f);
            margin: 0;
            padding: 0;
            color: #131313;
        }

        header {
            background: linear-gradient(90deg, #d31f26, #ff6f61);
            color: #fff;
            padding: 1rem 0;
            text-align: center;
            font-size: 2rem;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
        }

        .container {
            margin: 20px auto;
            max-width: 1200px;
        }

        .section-title {
            font-size: 1.8rem;
            color: #ff6f61;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            background: #181a1b;
            border: none;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            color: #fff;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-custom {
            background: #d31f26;
            color: #fff;
            border-radius: 20px;
            padding: 10px 20px;
            border: none;
            font-weight: 600;
            font-family: 'Open Sans', sans-serif;
            transition: background 0.3s;
        }

        .btn-custom:hover {
            background: #ff6f61;
        }

        footer {
            background: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: 30px;
            font-size: 0.9rem;
            font-family: 'Open Sans', sans-serif;
        }
    </style>
</head>
<body>
    <header>
        Manage Your Routines
    </header>

    <div class="container">
        <h2 class="section-title">Existing Routines</h2>
        <div id="routines-list">
            <!-- Example routine cards -->
            <div class="card">
                <div class="card-body">
                    <p>Turn off all lights at 10 PM</p>
                    <div>
                        <button class="btn btn-custom" onclick="editRoutine('1')">Edit</button>
                        <button class="btn btn-custom" onclick="deleteRoutine('1')">Delete</button>
                    </div>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <p>Turn on coffee machine at 6 AM</p>
                    <div>
                        <button class="btn btn-custom" onclick="editRoutine('2')">Edit</button>
                        <button class="btn btn-custom" onclick="deleteRoutine('2')">Delete</button>
                    </div>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <button class="btn btn-custom mt-3" onclick="addNewRoutine()">Add New Routine</button>
        </div>
    </div>

    <footer>
        © powered by CodeSmiths
    </footer>

    <script>
        // JavaScript functions to handle adding, editing, and deleting routines

        function addNewRoutine() {
            const routine = prompt('Enter a new routine:');
            if (routine) {
                const routineList = document.getElementById('routines-list');
                const newCard = document.createElement('div');
                newCard.classList.add('card');
                newCard.innerHTML = `
                    <div class="card-body">
                        <p>${routine}</p>
                        <div>
                            <button class="btn btn-custom" onclick="editRoutine()">Edit</button>
                            <button class="btn btn-custom" onclick="deleteRoutine(this)">Delete</button>
                        </div>
                    </div>
                `;
                routineList.appendChild(newCard);
            }
        }

        function editRoutine() {
            const updatedRoutine = prompt('Edit your routine:');
            if (updatedRoutine) {
                // Update the routine text
                event.target.parentElement.parentElement.querySelector('p').textContent = updatedRoutine;
            }
        }

        function deleteRoutine(button) {
            const card = button.closest('.card');
            card.remove();
        }
    </script>
</body>
</html>
